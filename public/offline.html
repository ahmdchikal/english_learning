<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnglishPath — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #111827;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #4f46e5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 28px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      p {
        color: #6b7280;
        max-width: 24rem;
        margin: 0;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.6rem 1.25rem;
        border-radius: 0.75rem;
        border: none;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0f;
          color: #f3f4f6;
        }
        p {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <div class="badge">E</div>
    <h1>Anda sedang offline</h1>
    <p>
      Sepertinya tidak ada koneksi internet. Halaman ini akan otomatis memuat
      ulang saat koneksi Anda tersambung kembali.
    </p>
    <button onclick="location.reload()">Coba Lagi</button>
  </body>
</html>
